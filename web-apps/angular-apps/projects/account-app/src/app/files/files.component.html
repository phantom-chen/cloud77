<div class="container">
  @if (!loading && !isLogin) {
    <app-un-authorized
      (ssoSignIn)="onSSO()"
    ></app-un-authorized>
  }

  @if (isLogin) {
    <div>
      <div style="display: flex">
        <div style="width: 50%">
          <input
            #fileInput
            placeholder="upload file"
            type="file"
            (change)="onFileChange($event)"
            />
            @if (uploadEnabled) {
              <button mat-raised-button (click)="uploadFile()">
                Upload
              </button>
            }
            <button mat-flat-button (click)="clearFileInput()">Clear Selected File</button>
            @if (uploadProgress > 0 && uploadProgress < 100) {
              <p>
                {{ uploadProgress }}%
              </p>
            }
          </div>
          <div style="width: 50%">
            <mat-selection-list (selectionChange)="onSelectedFilesChange($event)">
              @for (f of files; track f) {
                <mat-list-option [value]="f">{{ f }}</mat-list-option>
              }
            </mat-selection-list>
            @if (selectedFiles.length > 0) {
              <button mat-button (click)="deleteFile()">
                Delete Selected Files
              </button>
            }
            @if (selectedFiles.length > 0) {
              <button mat-flat-button (click)="downloadFile()">
                Download Selected Files
              </button>
            }
          </div>
        </div>
      </div>
    }
  </div>
