<mat-toolbar color="primary">
    <mat-toolbar-row>
        <button mat-icon-button class="example-icon" aria-label="Example icon-button with menu icon"
            (click)="sidenav.toggle()">
            <mat-icon>menu</mat-icon>
        </button>

        <span>{{ title }}</span>
        <span class="example-spacer"></span>
        <a style="flex: 1 1 auto;"></a>

        <mat-icon>signal_cellular_alt</mat-icon>
        <mat-icon>signal_cellular_connected_no_internet_4_bar</mat-icon>
        <mat-icon class="example-icon" aria-hidden="false"
            aria-label="Example user verified icon">verified_user</mat-icon>

        <button mat-icon-button class="example-icon favorite-icon" aria-label="Example icon-button with heart icon">
            <mat-icon>favorite</mat-icon>
        </button>
        <button mat-icon-button class="example-icon" aria-label="Example icon-button with share icon">
            <mat-icon>share</mat-icon>
        </button>
        <button mat-button [matMenuTriggerFor]="menu1" style="vertical-align: middle;font-size: large;">
            <mat-icon>person_outline</mat-icon>{{ account}}
        </button>
        <mat-menu #menu1="matMenu">
            <button mat-menu-item>
                <mat-icon>account_box</mat-icon>
                Account
            </button>
            <button mat-menu-item>
                <mat-icon>settings</mat-icon>
                Settings
            </button>
            <button mat-menu-item>
                <mat-icon>history</mat-icon>
                History
            </button>
            <button mat-menu-item>
                <mat-icon>map</mat-icon>
                Map
            </button>
            <button mat-menu-item>
                <mat-icon>place</mat-icon>
                Place
            </button>
            <button mat-menu-item>
                <mat-icon>assignment</mat-icon>
                Assignment
            </button>
            <button mat-menu-item>
                <mat-icon>grid_on</mat-icon>
                Grid
            </button>
            <button mat-menu-item>
                <mat-icon>table_chart</mat-icon>
                Table
            </button>
            <button mat-menu-item>
                <mat-icon>perm_media</mat-icon>
                Media
            </button>
            <button mat-menu-item>
                <mat-icon>logout</mat-icon>
                Logout
            </button>
            <button mat-menu-item>
                <mat-icon>exit_to_app</mat-icon>
                Sign Out
            </button>
        </mat-menu>

    </mat-toolbar-row>

</mat-toolbar>

<mat-sidenav-container style="min-height: 600px;">
    <mat-sidenav #sidenav mode="side" opened="true" align="start">
        <mat-nav-list>
            <a mat-list-item routerLink="/sample/layout" routerLinkActive="active" mat-line
                style="color: green;font-weight: bold;">
                <span style="width: 6px;margin-right: 4px;" [style.background-color]="homeColor"></span>
                <mat-icon mat-list-icon>home</mat-icon>
                Home
            </a>
        </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
        <div class="content">
            <p>layout works!</p>
            <!-- <ng-content></ng-content> -->
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
