<div class="container">
    <app-un-authorized *ngIf="!loading && !isLogin" (ssoSignIn)="onSSO()"></app-un-authorized>

    <div *ngIf="isLogin">
        <div class="row col-lg-12">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <p style="font-weight: bold">Account Info</p>
                    </div>

                    <div class="card-body">
                        <div class="content">
                            <div class="row">
                                <mat-form-field>
                                    <mat-label>Email</mat-label>
                                    <input matInput placeholder="Email" [(ngModel)]="email" disabled />
                                </mat-form-field>
                            </div>

                            <div class="row">
                                <mat-form-field>
                                    <mat-label>Username</mat-label>
                                    <input matInput placeholder="Username" [(ngModel)]="name" disabled />
                                </mat-form-field>
                            </div>

                            <div class="row">
                                <ng-container *ngTemplateOutlet="wc"></ng-container>
                                <ng-template #wc>
                                    <button>
                                        <span>WeChat</span>
                                        <svg class="icon"
                                            style="width: 1.0009765625em;height: 1em;vertical-align: middle;fill: currentColor;overflow: hidden;"
                                            viewBox="0 0 1025 1024" version="1.1" xmlns="http://www.w3.org/2000/svg"
                                            p-id="3659">
                                            <path
                                                d="M1024.16 694.816c0-149.92-143.104-271.392-319.584-271.392-176.576 0-319.68 121.504-319.68 271.392S528 966.208 704.576 966.208c55.456 0 107.648-12.096 153.184-33.248l125.984 54.528-14.592-140.544c34.784-43.392 55.04-95.808 55.04-152.128zM596.832 621.28c-25.152 0-45.472-20.352-45.472-45.472s20.32-45.472 45.472-45.472c25.12 0 45.44 20.384 45.44 45.472s-20.384 45.472-45.44 45.472z m215.392 0c-25.056 0-45.44-20.352-45.44-45.472s20.384-45.472 45.44-45.472c25.184 0 45.536 20.384 45.536 45.472s-20.352 45.472-45.536 45.472zM704.576 387.488c49.376 0 96.416 8.8 139.264 24.64 0.32-5.728 0.992-11.232 0.992-16.992 0-198.08-189.152-358.624-422.432-358.624C189.184 36.512 0.032 197.024 0.032 395.136c0 74.496 26.816 143.776 72.704 201.12L53.472 781.92l166.432-72.096c41.216 19.2 86.784 32.16 134.88 38.784-3.616-17.504-5.824-35.424-5.824-53.792 0.032-169.44 159.552-307.296 355.616-307.296z m-139.808-209.6c33.184 0 60 26.88 60 60 0 33.184-26.816 60.064-60 60.064s-60.032-26.88-60.032-60.064c0-33.152 26.88-60 60.032-60zM280.032 297.952c-33.184 0-60-26.88-60-60.064 0-33.152 26.848-60 60-60 33.184 0 60.032 26.88 60.032 60s-26.88 60.064-60.032 60.064z"
                                                fill="#51C332" p-id="3660"></path>
                                        </svg>
                                    </button>
                                </ng-template>
                            </div>

                            <div class="row">
                                <span>You are confirmed<mat-icon>verified</mat-icon></span>
                            </div>

                            <div *ngIf="!confirmed" class="row" style="display: flex">
                                <p class="text-danger">You are not confirmed.</p>
                                <button mat-raised-button color="primary" (click)="sendConfirmationEmail()">
                                    Send me the email to confirm.
                                </button>
                            </div>

                            <div>
                                <app-preview [content]="preview" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <p style="font-weight: bold">Profile Info</p>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <mat-form-field appearance="outline" class="col-lg-6">
                                <mat-label>Surname</mat-label>
                                <input matInput placeholder="Surname" [(ngModel)]="profile.surname">
                            </mat-form-field>
                            <mat-form-field appearance="outline" class="col-lg-6">
                                <mat-label>Given Name</mat-label>
                                <input matInput placeholder="GivenName" [(ngModel)]="profile.givenName">
                            </mat-form-field>
                        </div>

                        <div class="row">
                            <mat-form-field appearance="outline" class="col-lg-6">
                                <mat-label>Company</mat-label>
                                <input matInput placeholder="Company" [(ngModel)]="profile.company">
                            </mat-form-field>
                            <mat-form-field appearance="outline" class="col-lg-6">
                                <mat-label>Company Type</mat-label>
                                <input matInput placeholder="Company Type" [(ngModel)]="profile.companyType">
                            </mat-form-field>
                        </div>

                        <div class="row">
                            <mat-form-field appearance="outline">
                                <mat-label>Title</mat-label>
                                <input matInput placeholder="Title" [(ngModel)]="profile.title">
                            </mat-form-field>
                        </div>

                        <div class="row">
                            <mat-form-field appearance="outline" class="col-lg-6">
                                <mat-label>City</mat-label>
                                <input matInput placeholder="City" [(ngModel)]="profile.city">
                            </mat-form-field>
                            <mat-form-field appearance="outline" class="col-lg-6">
                                <mat-label>Post</mat-label>
                                <input matInput placeholder="Post" [(ngModel)]="profile.post">
                            </mat-form-field>
                        </div>

                        <div class="row">
                            <mat-form-field appearance="outline">
                                <mat-label>Address (WIP)</mat-label>
                                <input matInput placeholder="Address (WIP)">
                            </mat-form-field>

                        </div>

                        <div class="row">
                            <mat-form-field appearance="outline" class="col-lg-6">
                                <mat-label>Phone</mat-label>
                                <input matInput placeholder="Phone" [(ngModel)]="profile.phone">
                            </mat-form-field>
                            <mat-form-field appearance="outline" class="col-lg-6">
                                <mat-label>Fax</mat-label>
                                <input matInput placeholder="Fax" [(ngModel)]="profile.fax">
                            </mat-form-field>
                        </div>


                        <div class="row">
                            <mat-form-field appearance="outline">
                                <mat-label>Contact</mat-label>
                                <input matInput placeholder="Contact" [(ngModel)]="profile.contact">
                            </mat-form-field>
                        </div>


                        <div class="row">
                            <mat-form-field appearance="outline">
                                <mat-label>Supplier</mat-label>
                                <input matInput placeholder="Supplier" [(ngModel)]="profile.supplier">
                            </mat-form-field>
                        </div>

                        <div class="row">
                            <button mat-raised-button color="primary" (click)="updateProfile()">
                                Update
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
