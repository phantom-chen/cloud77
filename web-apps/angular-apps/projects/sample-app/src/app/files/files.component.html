<p>files works!</p>
<input type="file" (change)="onFileSelected($event)" />
<button (click)="uploadFile()">Upload</button>
@if (progress) {
  <span style="font-weight: bold;">{{ progress }}</span>
}
<button (click)="getFileList()">Files</button>

<ul>
  @for (item of files; track item) {
    <li (click)="selectFile(item)">{{ item }}</li>
  }
</ul>


@if (file) {
  <p>Selected file: {{ file }}</p>
}
@if (file) {
  <button (click)="deleteFile(file)">Delete selected file</button>
}
